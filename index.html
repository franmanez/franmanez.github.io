<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Regalo de Boda · Paco & Tania</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fondo decorativo -->
    <div class="background">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="stars"></div>
    </div>

    <main class="landing">

        <div class="top-label">
            <span></span>
            UNA MISIÓN MUY ESPECIAL
            <span></span>
        </div>

        <div class="title-wrapper">

            <p class="small-title">REGALO DE</p>

            <h1>
                Boda
            </h1>

            <div class="ornament">
                <span></span>
                <span class="diamond">◆</span>
                <span></span>
            </div>

            <h2>
                Paco <span>&</span> Tania
            </h2>

        </div>

        <div class="escape-box">

            <div class="escape-label">
                ROOM ESCAPE
            </div>

            <p>
                Una historia de amor.<br>
                Una misión secreta.<br>
                Y un regalo que tendréis que descubrir.
            </p>

        </div>

        <button id="startButton" class="start-button">
            <span>COMENZAR LA MISIÓN</span>
            <span class="arrow">→</span>
        </button>

        <div class="bottom-text">
            <span>ESTRENO</span>
            <span class="dot">·</span>
            <span>2026</span>
        </div>

    </main>

    <!-- Pantalla posterior -->
    <section id="mission" class="mission hidden">

        <div class="mission-content">

            <div class="mission-number">
                01
            </div>

            <h2>
                La película<br>
                comienza ahora
            </h2>

            <p>
                Paco y Tania, habéis sido seleccionados
                para una misión muy especial.
            </p>

            <button id="backButton" class="start-button">
                VOLVER
            </button>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
